[project]
name = "font-detector"
version = "0.1.0"
description = "PDF本文から指定フォントの箇所を検出・強調表示するツール"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    # 画像内の文字判定 (OCR本体の Tesseract は別途インストール)
    "opencv-python-headless>=4.8",
    "fonttools>=4.40",
    "pillow>=10",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
font-detector = "font_detector.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
font_detector = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
